asset: BTC/USDT
exchange: binance
testnet: true
paper_capital_usd: 10000
loop_interval_seconds: 900
monitor:
  interval_seconds: 60
  breaking_news_threshold: 0.65
risk:
  mode: balanced
  buy_threshold: 74           # relevé 70→74 (5 trades perdants 70-73.9 — no edge confirmé mai 2026)
  exit_threshold: 62          # relevé 52→62 : 52 ne se déclenche jamais (floor 49.5 avec market=90)
  buy_cooldown_minutes: 120   # cooldown 2h anti-doublon (ex: trades 03:45+03:47 même signal)
  kelly_max_fraction: 0.25
  position_size_pct: 5.0
  max_open_positions: 0       # 0 = illimité (aligné sur la config globale)
  atr_multiplier_sl: 1.8
  atr_multiplier_tp: 3.0
  atr_period: 14
  max_drawdown_pct: 15.0
  ma50_filter_mode: gradual
  ma50_strong_signal_threshold: 72
  ma50_gradual_size_factor: 0.5
  human_in_the_loop: false
circuit_breaker:
  funding_warning: 0.00018
  funding_block: 0.00045
  sustain_period_cycles: 3
  max_reduction: 0.75
scoring:
  weights:
    mirofish: 0.12
    market: 0.30  # réduit 0.40→0.30 : market_data bloqué à 90 (RSI<30 lagging) — moins de dominance
    agents: 0.40  # augmenté 0.30→0.40 : market_regime (WR 66.7%) mérite plus de poids
    contrarian: 0.18
market_regime:
  n_hmm_states: 2
  vol_window: 48      # 30 → 48 candles 15m = 12h (moins réactif aux micro-corrections)
  trend_window: 100   # 50 → 100 candles 15m = 25h (contexte tendance plus robuste)
  adx_period: 21      # 18 → 21 (standard institutionnel)
agents:
  market_data:
    enabled: true
  fundamental:
    enabled: true
    provider: blockchain_info
    on_chain_enabled: true
  x_sentiment:
    enabled: true
    keywords:
    - bitcoin
    - BTC
    - crypto
    - blockchain
    - halving
    - ETF
  contrarian:
    enabled: true
  fear_greed:
    enabled: true
    weight_in_scoring: 0.0  # méta-analyse 2026-04-16 : scores 77-86 systématiquement optimistes pendant les pertes
  polymarket:
    enabled: false  # méta-analyse 2026-04-16 : valeur constante sur 28/28 trades — aucune info différentielle
  timesfm:
    enabled: false
  market_regime:
    enabled: true
  bull_bear_debate:
    enabled: false
dashboard:
  widgets:
    funding_rate: true
    btc_dominance: true
    liquidations: false
    economic_calendar: false
    dxy_gauge: false
    session_clock: false
crawler:
  templates:
  - '{asset} macro outlook {year}'
  - bitcoin price prediction {year}
  - crypto regulation news {year}
  - DeFi on-chain activity {year}
  - institutional crypto adoption {year}
  - blockchain network metrics {year}
  - tech innovation AI disruption {year}
  - BTC ETF flows market impact {year}
  - bitcoin halving cycle analysis {year}
mirofish:
  seed_news_weight: 0.7
  air_du_temps_weight: 0.3
