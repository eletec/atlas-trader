asset: BTC/USDT
timeframe: "5m"              # Q1/Q15 : timeframe par actif (éditable depuis Admin)
exchange: binance
testnet: true
paper_capital_usd: 10000

# ── Paramètres V2 (lus par graph/workflow.py) ─────────────────────────────────
# Les anciens seuils V1 (buy_threshold, exit_threshold, scoring, agents) sont
# supprimés — V2 décide uniquement sur P(up) + régime HMM.
v2_risk:
  stop_loss_atr_mult: 2.5       # SL en mode tendance (ATR × mult)
  take_profit_atr_mult: 3.5     # TP en mode tendance → R:R = 1.4
  fraction_per_trade: 0.0075    # 0.75% du capital par trade
  max_drawdown_pct: 15.0        # drawdown hebdo max avant kill-switch
  range_sl_atr_mult: 1.5        # SL mean-reverting (plus serré)
  range_tp_atr_mult: 1.5        # TP mean-reverting (symétrique, R:R=1.0)
  range_fraction_mult: 0.50     # 50% du sizing normal en range
circuit_breaker:
  funding_warning: 0.00018
  funding_block: 0.00045
  sustain_period_cycles: 3
  max_reduction: 0.75
scoring:
  weights:
    mirofish: 0.12
    market: 0.30  # réduit 0.40→0.30 : market_data bloqué à 90 (RSI<30 lagging) — moins de dominance
    agents: 0.40  # augmenté 0.30→0.40 : market_regime (WR 66.7%) mérite plus de poids
    contrarian: 0.18
market_regime:
  n_hmm_states: 2
  vol_window: 48      # 30 → 48 candles 15m = 12h (moins réactif aux micro-corrections)
  trend_window: 100   # 50 → 100 candles 15m = 25h (contexte tendance plus robuste)
  adx_period: 21      # 18 → 21 (standard institutionnel)
agents:
  market_data:
    enabled: true
  fundamental:
    enabled: true
    provider: blockchain_info
    on_chain_enabled: true
  x_sentiment:
    enabled: true
    keywords:
    - bitcoin
    - BTC
    - crypto
    - blockchain
    - halving
    - ETF
  contrarian:
    enabled: true
  fear_greed:
    enabled: true
    weight_in_scoring: 0.0  # méta-analyse 2026-04-16 : scores 77-86 systématiquement optimistes pendant les pertes
  polymarket:
    enabled: false  # méta-analyse 2026-04-16 : valeur constante sur 28/28 trades — aucune info différentielle
  timesfm:
    enabled: false
  market_regime:
    enabled: true
  bull_bear_debate:
    enabled: false
dashboard:
  widgets:
    funding_rate: true
    btc_dominance: true
    liquidations: false
    economic_calendar: false
    dxy_gauge: false
    session_clock: false
crawler:
  templates:
  - '{asset} macro outlook {year}'
  - bitcoin price prediction {year}
  - crypto regulation news {year}
  - DeFi on-chain activity {year}
  - institutional crypto adoption {year}
  - blockchain network metrics {year}
  - tech innovation AI disruption {year}
  - BTC ETF flows market impact {year}
  - bitcoin halving cycle analysis {year}
mirofish:
  seed_news_weight: 0.7
  air_du_temps_weight: 0.3
