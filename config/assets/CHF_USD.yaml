asset: CHF/USD
exchange: oanda          # via yfinance CHF=X en V2
testnet: true
paper_capital_usd: 5000

# ── Paramètres V2 (lus par graph/workflow.py) ─────────────────────────────────
v2_risk:
  stop_loss_atr_mult: 1.5
  take_profit_atr_mult: 2.5
  fraction_per_trade: 0.0030    # CHF : safe haven, très peu volatil
  max_drawdown_pct: 8.0
  range_sl_atr_mult: 1.0
  range_tp_atr_mult: 1.0
  range_fraction_mult: 0.60
circuit_breaker:
  funding_warning: 0.0
  funding_block: 0.0
  sustain_period_cycles: 0
  max_reduction: 0.0
scoring:
  weights:
    mirofish: 0.08
    market: 0.35
    agents: 0.42
    contrarian: 0.15
market_regime:
  n_hmm_states: 2
  vol_window: 30
  trend_window: 50
  adx_period: 14
agents:
  market_data:
    enabled: true
  fundamental:
    enabled: true
    provider: forex_fundamental
    on_chain_enabled: false
  economic_calendar:
    enabled: true
    high_impact_only: true
  x_sentiment:
    enabled: true
    keywords:
    - swiss franc
    - CHF
    - SNB
    - Swiss National Bank
    - Switzerland
    - safe haven
    - franc suisse
    - USD
  fear_greed:
    enabled: true
  polymarket:
    enabled: true
  timesfm:
    enabled: false
  central_bank:
    enabled: true
mirofish:
  seed_news_weight: 0.55
  air_du_temps_weight: 0.45
session:
  type: london_ny
  timezone: Europe/London
