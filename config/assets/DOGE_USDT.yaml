asset: DOGE/USDT
timeframe: "5m"              # timeframe per asset (editable from Admin)
exchange: binance
testnet: true
paper_capital_usd: 10000

# ── V2 risk parameters (read by graph/workflow.py) ────────────────────────────
# DOGE is high-volatility meme asset — tighter sizing, higher DD tolerance
v2_risk:
  stop_loss_atr_mult: 2.0
  take_profit_atr_mult: 4.0    # wider TP to capture meme-driven spikes
  fraction_per_trade: 0.0040   # smaller size due to high vol
  max_drawdown_pct: 20.0
  range_sl_atr_mult: 1.5
  range_tp_atr_mult: 2.0
  range_fraction_mult: 0.20
circuit_breaker:
  funding_warning: 0.00018
  funding_block: 0.00045
  sustain_period_cycles: 3
  max_reduction: 0.75
scoring:
  weights:
    mirofish: 0.20             # meme sentiment matters more for DOGE
    market: 0.28
    agents: 0.34
    contrarian: 0.18
market_regime:
  n_hmm_states: 2
  vol_window: 48
  trend_window: 100
  adx_period: 21
agents:
  market_data:
    enabled: true
  fundamental:
    enabled: false
    on_chain_enabled: false
  x_sentiment:
    enabled: true
    keywords:
    - DOGE
    - Dogecoin
    - Elon Musk
    - meme coin
    - Shiba
    - DOGE Army
  contrarian:
    enabled: true
  fear_greed:
    enabled: true
  polymarket:
    enabled: false
  timesfm:
    enabled: false
  market_regime:
    enabled: true
