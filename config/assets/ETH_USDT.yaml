# ============================================================
# Atlas Trader — Config spécifique ETH/USDT
# Surcharge les valeurs globales de settings.yaml
# ============================================================

asset: "ETH/USDT"
exchange: "binance"
testnet: true

# Capital alloué à cet actif en mode paper trading (USD)
paper_capital_usd: 5000

loop_interval_seconds: 900    # 15 min

monitor:
  interval_seconds: 60
  breaking_news_threshold: 0.65

# ----------------------------------------------------------
# Risk & Decision Engine
# ----------------------------------------------------------
risk:
  mode: "balanced"
  buy_threshold: 60
  exit_threshold: 50
  kelly_max_fraction: 0.20
  position_size_pct: 4.0
  max_open_positions: 3
  atr_multiplier_sl: 2.0
  atr_multiplier_tp: 3.0
  atr_period: 14
  max_drawdown_pct: 18.0
  ma50_filter_mode: "gradual"
  ma50_strong_signal_threshold: 72
  ma50_gradual_size_factor: 0.5
  human_in_the_loop: false

circuit_breaker:
  funding_warning: 0.00018
  funding_block: 0.00045
  sustain_period_cycles: 3
  max_reduction: 0.75

# ----------------------------------------------------------
# Scoring — ETH a un beta plus élevé vs BTC
# ----------------------------------------------------------
scoring:
  weights:
    mirofish: 0.10
    market: 0.38
    agents: 0.34
    contrarian: 0.18

# ----------------------------------------------------------
# Market Regime
# ----------------------------------------------------------
market_regime:
  n_hmm_states: 2
  vol_window: 30
  trend_window: 50
  adx_period: 18

# ----------------------------------------------------------
# Agents on/off spécifiques ETH
# ----------------------------------------------------------
agents:
  market_data:
    enabled: true
  fundamental:
    enabled: true
    provider: "eth_fundamental"   # → EthFundamentalAgent
    on_chain_enabled: true
  x_sentiment:
    enabled: true
    keywords: ["ethereum", "ETH", "EIP", "layer2", "L2", "staking", "DeFi", "Pectra"]
  contrarian:
    enabled: true
  fear_greed:
    enabled: true
  polymarket:
    enabled: true
  timesfm:
    enabled: true
  market_regime:
    enabled: true
  bull_bear_debate:
    enabled: false

# ----------------------------------------------------------
# Dashboard
# ----------------------------------------------------------
dashboard:
  widgets:
    funding_rate: true
    btc_dominance: true
    liquidations: false
    economic_calendar: false
    dxy_gauge: false
    session_clock: false
    gas_price: true
    staking_yield: true
    defi_tvl: true
