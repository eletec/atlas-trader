asset: ETH/USDT
timeframe: "5m"              # Q1/Q15 : timeframe par actif (éditable depuis Admin)
exchange: binance
testnet: true
paper_capital_usd: 5000

# ── Paramètres V2 (lus par graph/workflow.py) ─────────────────────────────────
v2_risk:
  stop_loss_atr_mult: 2.0
  take_profit_atr_mult: 4.0
  fraction_per_trade: 0.0045
  max_drawdown_pct: 18.0
  range_sl_atr_mult: 1.5
  range_tp_atr_mult: 1.5
  range_fraction_mult: 0.25
circuit_breaker:
  funding_warning: 0.00018
  funding_block: 0.00045
  sustain_period_cycles: 3
  max_reduction: 0.75
scoring:
  weights:
    mirofish: 0.1
    market: 0.28  # réduit 0.38→0.28 : même problème market_data lagging
    agents: 0.44  # augmenté 0.34→0.44 : agents plus discriminants
    contrarian: 0.18
market_regime:
  n_hmm_states: 2
  vol_window: 48      # 30 → 48 candles 15m = 12h
  trend_window: 100   # 50 → 100 candles 15m = 25h
  adx_period: 21      # 18 → 21 (standard institutionnel)
agents:
  market_data:
    enabled: true
  fundamental:
    enabled: true
    provider: eth_fundamental
    on_chain_enabled: true
  x_sentiment:
    enabled: true
    keywords:
    - ethereum
    - ETH
    - EIP
    - layer2
    - L2
    - staking
    - DeFi
    - Pectra
  contrarian:
    enabled: true
  fear_greed:
    enabled: true
  polymarket:
    enabled: true
  timesfm:
    enabled: false
  market_regime:
    enabled: true
  bull_bear_debate:
    enabled: false
dashboard:
  widgets:
    funding_rate: true
    btc_dominance: true
    liquidations: false
    economic_calendar: false
    dxy_gauge: false
    session_clock: false
    gas_price: true
    staking_yield: true
    defi_tvl: true
crawler:
  templates:
  - '{asset} macro outlook {year}'
  - ethereum price prediction {year}
  - DeFi on-chain activity {year}
  - layer2 scaling adoption {year}
  - ethereum staking yield {year}
  - EVM ecosystem developments {year}
  - crypto regulation news {year}
  - smart contract security {year}
mirofish:
  seed_news_weight: 0.7
  air_du_temps_weight: 0.3
