asset: EUR/USD
exchange: oanda
testnet: true
paper_capital_usd: 5000
loop_interval_seconds: 900
monitor:
  interval_seconds: 120
  breaking_news_threshold: 0.65
risk:
  mode: conservative
  buy_threshold: 57
  exit_threshold: 46
  kelly_max_fraction: 0.12
  position_size_pct: 2.0
  max_open_positions: 2
  atr_multiplier_sl: 1.5
  atr_multiplier_tp: 2.0
  atr_period: 14
  max_drawdown_pct: 8.0
  ma50_filter_mode: strict
  ma50_strong_signal_threshold: 68
  ma50_gradual_size_factor: 0.5
  human_in_the_loop: false
circuit_breaker:
  funding_warning: 0.0
  funding_block: 0.0
  sustain_period_cycles: 0
  max_reduction: 0.0
scoring:
  weights:
    mirofish: 0.05
    market: 0.3
    agents: 0.5
    contrarian: 0.15
market_regime:
  n_hmm_states: 2
  vol_window: 20
  trend_window: 50
  adx_period: 14
agents:
  market_data:
    enabled: true
  fundamental:
    enabled: true
    provider: forex_fundamental
    on_chain_enabled: false
  economic_calendar:
    enabled: true
    high_impact_only: true
  central_bank:
    enabled: true
  x_sentiment:
    enabled: true
    keywords:
    - euro
    - EUR
    - ECB
    - BCE
    - Lagarde
    - Fed
    - Powell
    - USD
    - dollar
    - rate
    - inflation
    - parity
  contrarian:
    enabled: true
  fear_greed:
    enabled: false
  polymarket:
    enabled: false
  timesfm:
    enabled: false
  market_regime:
    enabled: true
  bull_bear_debate:
    enabled: false
dashboard:
  widgets:
    funding_rate: false
    btc_dominance: false
    liquidations: false
    economic_calendar: true
    dxy_gauge: true
    session_clock: true
    interest_rate_diff: true
    cot_positioning: true
crawler:
  templates:
  - EUR USD outlook {year}
  - ECB interest rate decision {year}
  - eurozone economic outlook {year}
  - Fed ECB policy divergence {year}
  - euro dollar parity forecast {year}
  - European energy crisis {year}
  - EUR USD technical analysis {year}
mirofish:
  seed_news_weight: 0.4
  air_du_temps_weight: 0.6
