asset: EUR/USD
timeframe: "15m"             # Q1/Q15 : timeframe par actif (éditable depuis Admin)
exchange: oanda          # via yfinance EURUSD=X en V2
testnet: true
paper_capital_usd: 5000

# ── Paramètres V2 (lus par graph/workflow.py) ─────────────────────────────────
v2_risk:
  stop_loss_atr_mult: 1.5       # forex : spreads faibles, SL serré acceptable
  take_profit_atr_mult: 2.5
  fraction_per_trade: 0.0030    # sizing faible (EUR/USD peu volatil en absolu)
  max_drawdown_pct: 8.0
  range_sl_atr_mult: 1.0
  range_tp_atr_mult: 1.0
  range_fraction_mult: 0.60     # EUR/USD trade bien en mean-reversion (sessions)
circuit_breaker:
  funding_warning: 0.0
  funding_block: 0.0
  sustain_period_cycles: 0
  max_reduction: 0.0
scoring:
  weights:
    mirofish: 0.05
    market: 0.3
    agents: 0.5
    contrarian: 0.15
market_regime:
  n_hmm_states: 2
  vol_window: 20
  trend_window: 50
  adx_period: 14
agents:
  market_data:
    enabled: true
  fundamental:
    enabled: true
    provider: forex_fundamental
    on_chain_enabled: false
  economic_calendar:
    enabled: true
    high_impact_only: true
  central_bank:
    enabled: true
  x_sentiment:
    enabled: true
    keywords:
    - euro
    - EUR
    - ECB
    - BCE
    - Lagarde
    - Fed
    - Powell
    - USD
    - dollar
    - rate
    - inflation
    - parity
  contrarian:
    enabled: true
  fear_greed:
    enabled: false
  polymarket:
    enabled: false
  timesfm:
    enabled: false
  market_regime:
    enabled: true
  bull_bear_debate:
    enabled: false
dashboard:
  widgets:
    funding_rate: false
    btc_dominance: false
    liquidations: false
    economic_calendar: true
    dxy_gauge: true
    session_clock: true
    interest_rate_diff: true
    cot_positioning: true
crawler:
  templates:
  - EUR USD outlook {year}
  - ECB interest rate decision {year}
  - eurozone economic outlook {year}
  - Fed ECB policy divergence {year}
  - euro dollar parity forecast {year}
  - European energy crisis {year}
  - EUR USD technical analysis {year}
mirofish:
  seed_news_weight: 0.4
  air_du_temps_weight: 0.6
