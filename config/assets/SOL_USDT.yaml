asset: SOL/USDT
timeframe: "5m"              # Q1/Q15 : timeframe par actif (éditable depuis Admin)
exchange: binance
testnet: true
paper_capital_usd: 5000

# ── Paramètres V2 (lus par graph/workflow.py) ─────────────────────────────────
v2_risk:
  stop_loss_atr_mult: 2.5
  take_profit_atr_mult: 3.5
  fraction_per_trade: 0.0050    # SOL beta très élevé — sizing conservateur
  max_drawdown_pct: 20.0
  range_sl_atr_mult: 1.5
  range_tp_atr_mult: 1.5
  range_fraction_mult: 0.40     # encore plus conservateur en range sur SOL
circuit_breaker:
  funding_warning: 0.00020
  funding_block: 0.00050
  sustain_period_cycles: 3
  max_reduction: 0.75
scoring:
  weights:
    mirofish: 0.1
    market: 0.28  # réduit 0.38→0.28 : même problème market_data lagging
    agents: 0.44  # augmenté 0.34→0.44 : agents plus discriminants
    contrarian: 0.18
market_regime:
  n_hmm_states: 2
  vol_window: 30
  trend_window: 50
  adx_period: 18
agents:
  market_data:
    enabled: true
  fundamental:
    enabled: true
    provider: sol_fundamental
    on_chain_enabled: false
  x_sentiment:
    enabled: true
    keywords:
    - solana
    - SOL
    - Firedancer
    - Anatoly
    - pump.fun
    - meme coin
    - DeFi solana
    - Solana Foundation
  contrarian:
    enabled: true
  fear_greed:
    enabled: true
  polymarket:
    enabled: true
  timesfm:
    enabled: false
  market_regime:
    enabled: true
  bull_bear_debate:
    enabled: false
dashboard:
  widgets:
    funding_rate: true
    btc_dominance: true
    liquidations: false
    economic_calendar: false
    dxy_gauge: false
    session_clock: false
    gas_price: false
    staking_yield: false
    defi_tvl: false
crawler:
  templates:
  - '{asset} solana price outlook {year}'
  - solana ecosystem growth DeFi {year}
  - SOL network activity validators {year}
  - Firedancer upgrade solana performance {year}
  - solana meme coins pump.fun sentiment {year}
  - layer1 competition solana vs ethereum {year}
  - solana institutional adoption {year}
  - crypto altcoin season rotation {year}
