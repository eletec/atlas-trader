asset: XAG/USD
timeframe: "15m"             # Q1/Q15 : timeframe par actif (éditable depuis Admin)
exchange: oanda          # via yfinance SI=F en V2
testnet: true
paper_capital_usd: 5000

# ── Paramètres V2 (lus par graph/workflow.py) ─────────────────────────────────
v2_risk:
  stop_loss_atr_mult: 2.0
  take_profit_atr_mult: 3.0
  fraction_per_trade: 0.0030    # argent plus volatile que or
  max_drawdown_pct: 10.0
  range_sl_atr_mult: 1.2
  range_tp_atr_mult: 1.2
  range_fraction_mult: 0.50
circuit_breaker:
  funding_warning: 0.0
  funding_block: 0.0
  sustain_period_cycles: 0
  max_reduction: 0.0
scoring:
  weights:
    mirofish: 0.08
    market: 0.35
    agents: 0.42
    contrarian: 0.15
market_regime:
  n_hmm_states: 2
  vol_window: 30
  trend_window: 50
  adx_period: 14
agents:
  market_data:
    enabled: true
  fundamental:
    enabled: true
    provider: commodity_fundamental
    on_chain_enabled: false
  economic_calendar:
    enabled: true
    high_impact_only: true
  x_sentiment:
    enabled: true
    keywords:
    - silver
    - XAG
    - argent
    - inflation
    - Fed
    - rate hike
    - USD
    - safe haven
    - precious metals
  fear_greed:
    enabled: true
  polymarket:
    enabled: true
  timesfm:
    enabled: false
  central_bank:
    enabled: true
crawler:
  templates:
  - '{asset} silver price outlook {year}'
  - silver industrial demand solar panels {year}
  - gold silver ratio precious metals {year}
  - silver ETF flows investment demand {year}
  - real interest rates silver inflation {year}
  - silver mining supply deficit {year}
  - green energy transition silver demand {year}
  - USD strength precious metals {year}
mirofish:
  seed_news_weight: 0.55
  air_du_temps_weight: 0.45
session:
  type: london_ny
  timezone: Europe/London
