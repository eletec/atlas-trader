asset: XAU/USD
timeframe: "15m"             # Q1/Q15 : timeframe par actif (éditable depuis Admin)
exchange: oanda          # via yfinance GC=F en V2
testnet: true
paper_capital_usd: 5000

# ── Paramètres V2 (lus par graph/workflow.py) ─────────────────────────────────
v2_risk:
  stop_loss_atr_mult: 2.0       # or : moins volatile que crypto, SL plus serré
  take_profit_atr_mult: 3.0
  fraction_per_trade: 0.0040    # sizing conservateur (safe haven)
  max_drawdown_pct: 10.0
  range_sl_atr_mult: 1.2        # or trade bien en mean-reversion — stop très serré
  range_tp_atr_mult: 1.2
  range_fraction_mult: 0.60     # or en range : meilleur potentiel mean-reverting
circuit_breaker:
  funding_warning: 0.0
  funding_block: 0.0
  sustain_period_cycles: 0
  max_reduction: 0.0
scoring:
  weights:
    mirofish: 0.08
    market: 0.35
    agents: 0.42
    contrarian: 0.15
market_regime:
  n_hmm_states: 2
  vol_window: 30
  trend_window: 50
  adx_period: 14
agents:
  market_data:
    enabled: true
  fundamental:
    enabled: true
    provider: gold_fundamental
    on_chain_enabled: false
  economic_calendar:
    enabled: true
    high_impact_only: true
  x_sentiment:
    enabled: true
    keywords:
    - gold
    - XAU
    - inflation
    - CPI
    - Fed
    - rate hike
    - USD
    - safe haven
    - geopolitics
  contrarian:
    enabled: true
  fear_greed:
    enabled: false
  polymarket:
    enabled: false
  timesfm:
    enabled: false
  market_regime:
    enabled: true
  bull_bear_debate:
    enabled: false
dashboard:
  widgets:
    funding_rate: false
    btc_dominance: false
    liquidations: false
    economic_calendar: true
    dxy_gauge: true
    session_clock: true
    gold_spot_chart: true
crawler:
  templates:
  - '{asset} gold price outlook {year}'
  - gold safe haven demand {year}
  - central bank gold reserves {year}
  - real interest rates gold {year}
  - inflation hedge precious metals {year}
  - gold ETF flows {year}
  - USD strength gold correlation {year}
  - geopolitics gold demand {year}
mirofish:
  seed_news_weight: 0.5
  air_du_temps_weight: 0.5
