asset: XAU/USD
exchange: oanda
testnet: true
paper_capital_usd: 5000
loop_interval_seconds: 900
monitor:
  interval_seconds: 120
  breaking_news_threshold: 0.65
risk:
  mode: conservative
  buy_threshold: 61
  exit_threshold: 55
  kelly_max_fraction: 0.15
  position_size_pct: 3.0
  max_open_positions: 2
  atr_multiplier_sl: 1.5
  atr_multiplier_tp: 3.0
  atr_period: 14
  max_drawdown_pct: 10.0
  ma50_filter_mode: strict
  ma50_strong_signal_threshold: 70
  ma50_gradual_size_factor: 0.6
  human_in_the_loop: false
circuit_breaker:
  funding_warning: 0.0
  funding_block: 0.0
  sustain_period_cycles: 0
  max_reduction: 0.0
scoring:
  weights:
    mirofish: 0.08
    market: 0.35
    agents: 0.42
    contrarian: 0.15
market_regime:
  n_hmm_states: 2
  vol_window: 30
  trend_window: 50
  adx_period: 14
agents:
  market_data:
    enabled: true
  fundamental:
    enabled: true
    provider: gold_fundamental
    on_chain_enabled: false
  economic_calendar:
    enabled: true
    high_impact_only: true
  x_sentiment:
    enabled: true
    keywords:
    - gold
    - XAU
    - inflation
    - CPI
    - Fed
    - rate hike
    - USD
    - safe haven
    - geopolitics
  contrarian:
    enabled: true
  fear_greed:
    enabled: false
  polymarket:
    enabled: false
  timesfm:
    enabled: false
  market_regime:
    enabled: true
  bull_bear_debate:
    enabled: false
dashboard:
  widgets:
    funding_rate: false
    btc_dominance: false
    liquidations: false
    economic_calendar: true
    dxy_gauge: true
    session_clock: true
    gold_spot_chart: true
crawler:
  templates:
  - '{asset} gold price outlook {year}'
  - gold safe haven demand {year}
  - central bank gold reserves {year}
  - real interest rates gold {year}
  - inflation hedge precious metals {year}
  - gold ETF flows {year}
  - USD strength gold correlation {year}
  - geopolitics gold demand {year}
mirofish:
  seed_news_weight: 0.5
  air_du_temps_weight: 0.5
