# ============================================================
# Atlas Trader — Settings GX10 (ASUS Accent GX10)
# ============================================================
# Copie complète de settings.yaml avec timesfm activé.
# Différences vs prod :
#   - timesfm.enabled: true
#   - timesfm.weight_in_scoring: 0.30
#   - timesfm.backend: cpu (passer à gpu après validation CUDA)
# ============================================================

project:
  name: Atlas Trader
  version: 1.0.0-MVP
  asset: BTC/USDT
  loop_interval_seconds: 300   # doit égaler timeframe en secondes (5m = 300s)
  active_assets:
  - BTC/USDT
  - ETH/USDT
  - SOL/USDT
  # XAU/XAG/WTI/GBP/EUR désactivés du pipeline 5m — pipeline daily dédié ci-dessous
  daily_active_assets:
  - XAU/USD
  - XAG/USD
  - WTI/USD
  - GBP/USD
  - EUR/USD
  daily_execution_hour_utc: 18   # 18h UTC = après clôture NYSE (16h30 ET)
crawler:
  provider: duckduckgo
  fallback_provider: duckduckgo
  n_themes: 10
  max_pages_per_theme: 10
  frequency: per_cycle
  llm_summarizer_model: claude-3-5-haiku-20241022
  request_timeout_seconds: 15

  templates_macro:
  - 'geopolitics energy price {year}'
  - 'inflation central bank policy {year}'
  - 'global market sentiment {year}'
  - 'risk-off risk-on sentiment {year}'
  - 'USD dollar index outlook {year}'
  - 'recession financial crisis risk {year}'

  templates: []
news:
  polling_interval_seconds: 1800
  max_items_per_cycle: 30
  relevance_score_threshold: 0.4

  sources_rss_macro:
  - https://feeds.bbci.co.uk/news/business/rss.xml
  - https://www.reutersagency.com/feed/?best-topics=business-finance&post_type=best
  - https://feeds.zerohedge.com/feeds/zerohedge.xml
  - https://www.scmp.com/rss/92/feed
  - https://asia.nikkei.com/rss/feed/technology
  - https://www.rt.com/rss/business/
  - https://en.caixin.com/rss/finance.xml

