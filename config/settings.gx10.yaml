  cryptopanic:
    enabled: true
    max_items: 15
    asset_currency_map:
      BTC/USDT: BTC
      ETH/USDT: ETH
      SOL/USDT: SOL
mirofish:
  n_agents: 5000
  n_steps: 100
  seed_news_weight: 0.6
  air_du_temps_weight: 0.4
  inject_custom_vars: {}
  async_mode: false
  timeout_seconds: 120
agents:
  market_data:
    enabled: true
    weight_in_scoring: 1.0
  fundamental:
    enabled: true
    weight_in_scoring: 0.0   # Brier 0.303, WR 40.4% — neutralisé (input contrarian uniquement)
  x_sentiment:
    enabled: true
    weight_in_scoring: 0.0   # Brier 0.413, WR 36.2%, avg_score 77 (perma-haussier) — neutralisé
  contrarian:
    enabled: true
    weight_in_scoring: 0.9
  fear_greed:
    enabled: true
    weight_in_scoring: 0.0   # Brier 0.476, WR 29.8%, avg_score 73 (perma-haussier) — neutralisé
  polymarket:
    enabled: true
    weight_in_scoring: 0.55  # Brier 0.244 — bon calibrage
  timesfm:
    enabled: false           # remplacé par Kronos
    weight_in_scoring: 0.0
  kronos:
    enabled: false           # désactivé — source /app/Kronos-master non installé sur GX10
    weight_in_scoring: 0.20  # sera réactivé après: curl .../Kronos/master.tar.gz | tar -xz -C /app
  market_regime:
    enabled: true
    weight_in_scoring: 0.70  # Brier 0.225, WR 66% — meilleur agent
  bull_bear_debate:
    enabled: false
    weight_in_scoring: 0.0
  alpha_combination:
    enabled: false           # désactivé — poids statiques utilisés
    min_history: 20
    lookback_days: 90
    correlation_threshold: 0.70
    ic_floor: 0.0
timesfm:
  forecast_horizon: 24
  backend: cpu
kronos:
  enabled: true
  model_name: "NeoQuasar/Kronos-mini"
  forecast_horizon: 96
  lookback: 400
  temperature: 1.0
  top_p: 0.9
  sample_count: 1
  timeout_seconds: 120
  backend: cpu
market_regime:
  n_hmm_states: 2
  vol_window: 30
  trend_window: 100
  adx_period: 18
scoring:
  weights:
    mirofish: 0.12
    market: 0.4
    agents: 0.3
    contrarian: 0.18
  min_weight: 0.05
  max_weight: 0.6
  normalization_window: 30
risk:
  mode: balanced
  kelly_max_fraction: 0.25
  max_drawdown_pct: 15.0
  position_size_pct: 5.0
  atr_multiplier_sl: 2.0
  atr_multiplier_tp: 3.0
  atr_period: 14
  buy_threshold: 68         # zone neutre large [38-68] — entrée uniquement sur conviction forte
  exit_threshold: 38        # sort uniquement sur signal vraiment baissier
  human_in_the_loop: false
  ma50_filter_mode: gradual
  ma50_strong_signal_threshold: 72
  ma50_gradual_size_factor: 0.5
  max_open_positions: 1
  sell_threshold: 30
circuit_breaker:
  funding_warning: 0.00018
  funding_block: 0.00045
  sustain_period_cycles: 3
  max_reduction: 0.75
assets:
  universe:
  - symbol: BTC/USDT
    exchange: binance
    timeframe: 15m
    theme_mapping:
    - bitcoin
    - crypto
    - blockchain
  active_asset: BTC/USDT
exchange:
  name: binance
  testnet: true
  websocket: true
  fallback_polling_seconds: 15
  paper_capital_usd: 10000
  limit_order_offset_pct: 0.1
  limit_fill_timeout_s: 120
logging:
  level: INFO
  file_path: logs/zeitgeist.log
  max_bytes: 5242880
  backup_count: 5
  sqlite_db: storage/zeitgeist.db
  format: '[%(asctime)s] [%(levelname)s] [%(name)s] %(message)s'
  telegram_enabled: false
  discord_enabled: false
  alert_score_threshold: 85
llm:
  provider: deepseek
  model: deepseek-chat
  temperature: 0.3
  max_tokens: 4096
  request_timeout_seconds: 60
  max_tokens_per_cycle: 15000
  cache_responses: true
  cache_ttl_seconds: 3600
  deepseek_api_key: REDACTED_COMPROMISED_KEY
post_mortem:
  enabled: true
  delay_hours: 24
  min_history_for_adjustment: 10
  learning_rate: 0.05
  walk_forward_days: 7
  correlation_threshold: 0.75
  meta_analysis_interval_days: 14
  meta_analysis_days: 30
monitor:
  interval_seconds: 60
  breaking_news_threshold: 0.8
  sl_tp_check_enabled: true
admin:
  password_hash: ''
  session_timeout_minutes: 60
quant:
  timeframe: "5m"            # Timeframe OHLCV (ccxt notation)
  history_days: 90           # 90j = fenêtre live (360j trop lent sur 5m — normalize O(N×window))
  train_fraction: 0.70       # 70% train / 30% OOS pour refit initial
  horizon_bars: 12           # Horizon de prédiction (1h sur 5m — consensus 3 IA : 20min trop bruité)
  p_up_threshold: 0.57       # plus sélectif (réduit sur-trading)
  p_dn_threshold: 0.43       # plus sélectif côté short
  use_hmm: false             # Audit 3 IA : HMM instable sur 5m (variance dégénérée XAU, permutations) → règles ADX+vol_of_vol
  refit_interval_hours: 168  # Refit hebdomadaire (7 × 24h)
  # ── Trailing stop (Q16 consensus 3 IA — was 1.0×1.0, trop agressif) ──────────
  trailing_activation_atr: 1.5   # was 1.0 — laisse la position respirer
  trailing_distance_atr: 1.5     # was 1.0 — recommandation 1.5-2.0×ATR
  # ── Mean-reverting RANGE (désactivé — consensus 3 IA : R:R=1.0 = EV négative après frais) ───
  range_enabled: false       # Audit 3 IA : range trading EV<0 sur crypto HF → désactivé
  range_sl_atr_mult: 1.5     # SL plus serré en range (vs 2.5 en trend)
  range_tp_atr_mult: 1.5     # TP symétrique → R:R = 1.0
  range_fraction_mult: 0.35  # réduit le sizing mean-reversion
  range_bb_long_threshold: 0.07   # filtre plus strict des extrêmes
  range_bb_short_threshold: 0.93  # filtre plus strict des extrêmes
  range_vwap_conf: 0.45      # confirmation VWAP plus exigeante
  # ── Walk-forward (durci après consensus 3 IA) ────────────────────────────
  wf_train_days: 90          # fenêtre train
  wf_test_days: 30           # fenêtre test OOS non-chevauchante
  wf_step_days: 30           # pas de défilement (step = test → pas de leak)
  wf_min_folds: 8            # minimum 8 folds (240j OOS avant validation)
  # ── Critères go-live durcis (Grok + GPT + DeepSeek) ─────────────────────
  go_live_sharpe_min: 0.80   # was 0.5 — trop permissif sur intraday bruité
  go_live_pf_min: 1.30       # was 1.2
  go_live_pvalue_max: 0.05   # was 0.10
  go_live_positive_folds_pct: 0.65  # was 0.60

  # ── Sources de données (Q11/Q12) ──────────────────────────────────────────
  data_provider: "auto"            # "auto" | "twelve_data" | "yahoo"

  # ── Features avancées (Q13/Q14) ────────────────────────────────────────────
  use_dxy_feature: true            # Q14 : DXY comme feature inter-marché

  # ── Horizon sweep (Q3) ─────────────────────────────────────────────────────
  horizon_sweep_values: [2, 4, 8, 12]   # horizons à tester en sweep

  # ── Refit adaptatif KS-test (Q17) ──────────────────────────────────────────
  refit_trigger: "schedule"        # "schedule" | "ks_test" | "both"
  refit_ks_pvalue_threshold: 0.05  # seuil KS-test pour déclencher le refit
  refit_ks_window_days: 14         # fenêtre récente pour le KS-test (jours)

  # ── Pipeline DAILY (FX/métaux) ──────────────────────────────────────────────
  daily_active_assets:
  - XAU/USD
  - XAG/USD
  - WTI/USD
  - GBP/USD
  - EUR/USD
  daily_history_days: 1825          # 5 ans (> 200 bar MA + warmup)
  daily_horizon_bars: 5             # prédire direction dans 5 jours (1 semaine)
  daily_norm_window_days: 252       # 1 an boursier pour rolling normalization
  daily_refit_interval_days: 7      # refit hebdomadaire
  daily_execution_hour_utc: 18      # 18h UTC (clôture NYSE 16h30 ET + 1h30 buffer)
  daily_p_up_threshold: 0.57        # seuil global LONG daily
  daily_p_dn_threshold: 0.43        # seuil global SHORT daily

  # ── Seuils p_up/p_dn par actif (override du global) ──────────────────────
  asset_thresholds:
    EUR/USD:
      p_up_threshold: 0.62   # max P_up=0.614 sur 5y → désactive les LONG
      p_dn_threshold: 0.40
    ETH/USDT:
      p_up_threshold: 0.62   # encore plus sélectif en tendance
      p_dn_threshold: 0.40
    SOL/USDT:
      p_up_threshold: 0.60   # réduit les faux signaux trend
      p_dn_threshold: 0.40

  # ── Config par actif (timeframe, historique, capital dédié) ────────────────
  asset_config:
    BTC/USDT:
      capital_usd: 10000
    ETH/USDT:
      capital_usd: 5000
    SOL/USDT:
      capital_usd: 5000
    XAU/USD:
      capital_usd: 5000
      p_up_threshold: 0.57
      p_dn_threshold: 0.43
    XAG/USD:
      capital_usd: 3000
      p_up_threshold: 0.58
      p_dn_threshold: 0.43
    WTI/USD:
      capital_usd: 3000
      p_up_threshold: 0.58
      p_dn_threshold: 0.42
    GBP/USD:
      capital_usd: 5000
      p_up_threshold: 0.58
      p_dn_threshold: 0.42
    EUR/USD:
      capital_usd: 5000
      p_up_threshold: 0.60
      p_dn_threshold: 0.42

# ── Sources de données (clé API dans config/secrets.yaml — gitignored) ──────
data:
  provider: "auto"           # "auto" | "twelve_data" | "yahoo"
  twelve_data_key: ""        # override local ; préférer config/secrets.yaml
