project:
  name: Atlas Trader
  version: 1.0.0-MVP
  asset: BTC/USDT
  loop_interval_seconds: 900
  active_assets:
  - BTC/USDT
  - ETH/USDT
  - XAU/USD
  - GBP/USD
  - EUR/USD
crawler:
  provider: duckduckgo
  fallback_provider: duckduckgo
  n_themes: 10
  max_pages_per_theme: 10
  frequency: per_cycle
  llm_summarizer_model: claude-3-5-haiku-20241022
  request_timeout_seconds: 15
  templates:
  - '{asset} macro outlook {year}'
  - geopolitics energy price {year}
  - inflation central bank policy {year}
  - crypto regulation news {year}
  - tech innovation AI disruption {year}
  - global market sentiment {year}
  - DeFi on-chain activity {year}
  - institutional crypto adoption {year}
  - risk-off risk-on sentiment {year}
  - blockchain network metrics {year}
news:
  polling_interval_seconds: 1800
  keywords_per_asset:
    BTC/USDT:
    - bitcoin
    - BTC
    - crypto
    - blockchain
    - halving
    - ETF
  sources_rss:
  - https://feeds.feedburner.com/CoinDesk
  - https://cointelegraph.com/rss
  - https://cryptonews.com/news/feed/
  - https://bitcoinmagazine.com/.rss/full/
  - https://decrypt.co/feed
  - https://www.theblock.co/rss.xml
  - https://ambcrypto.com/feed/
  - https://news.8btc.com/feed
  - https://www.coindesk.com/arc/outboundfeeds/rss/
  - https://en.caixin.com/rss/finance.xml
  - https://forklog.com/feed/
  - https://bits.media/rss/
  - https://feeds.zerohedge.com/feeds/zerohedge.xml
  - https://www.rt.com/rss/business/
  - https://www.scmp.com/rss/92/feed
  - https://feeds.bbci.co.uk/news/business/rss.xml
  - https://www.reutersagency.com/feed/?best-topics=business-finance&post_type=best
  - https://asia.nikkei.com/rss/feed/technology
  max_items_per_cycle: 30
  relevance_score_threshold: 0.4
  sources_nitter:
  - saylor
  - BitcoinMagazine
  - whale_alert
  - woonomic
  - CryptoHayes
  - RayDalio
  - zerohedge
  - LynAldenContact
  - WuBlockchain
  - colin_wu_
  sources_reddit:
  - Bitcoin
  - CryptoCurrency
  - btc
  cryptopanic:
    enabled: true
    max_items: 15
mirofish:
  n_agents: 5000
  n_steps: 100
  seed_news_weight: 0.6
  air_du_temps_weight: 0.4
  inject_custom_vars: {}
  async_mode: false
  timeout_seconds: 120
agents:
  market_data:
    enabled: true
    weight_in_scoring: 1.0
  fundamental:
    enabled: true
    weight_in_scoring: 0.8
  x_sentiment:
    enabled: true
    weight_in_scoring: 0.7
  contrarian:
    enabled: true
    weight_in_scoring: 0.9
  fear_greed:
    enabled: true
    weight_in_scoring: 0.85
  polymarket:
    enabled: true
    weight_in_scoring: 0.85
  timesfm:
    enabled: true
    weight_in_scoring: 0.9
  market_regime:
    enabled: true
    weight_in_scoring: 0.0
  bull_bear_debate:
    enabled: false
    weight_in_scoring: 0.0
timesfm:
  forecast_horizon: 24
  backend: cpu
market_regime:
  n_hmm_states: 2
  vol_window: 30
  trend_window: 50
  adx_period: 18
scoring:
  weights:
    mirofish: 0.12
    market: 0.4
    agents: 0.3
    contrarian: 0.18
  min_weight: 0.05
  max_weight: 0.6
  normalization_window: 30
risk:
  mode: balanced
  kelly_max_fraction: 0.25
  max_drawdown_pct: 15.0
  position_size_pct: 5.0
  atr_multiplier_sl: 2.0
  atr_multiplier_tp: 3.0
  atr_period: 14
  buy_threshold: 62
  exit_threshold: 52
  human_in_the_loop: false
  ma50_filter_mode: gradual
  ma50_strong_signal_threshold: 72
  ma50_gradual_size_factor: 0.5
  max_open_positions: 3
  sell_threshold: 30
circuit_breaker:
  funding_warning: 0.00018
  funding_block: 0.00045
  sustain_period_cycles: 3
  max_reduction: 0.75
assets:
  universe:
  - symbol: BTC/USDT
    exchange: binance
    timeframe: 15m
    theme_mapping:
    - bitcoin
    - crypto
    - blockchain
  active_asset: BTC/USDT
exchange:
  name: binance
  testnet: true
  websocket: true
  fallback_polling_seconds: 15
  paper_capital_usd: 10000
  limit_order_offset_pct: 0.1
  limit_fill_timeout_s: 120
logging:
  level: INFO
  file_path: logs/zeitgeist.log
  max_bytes: 5242880
  backup_count: 5
  sqlite_db: storage/zeitgeist.db
  format: '[%(asctime)s] [%(levelname)s] [%(name)s] %(message)s'
  telegram_enabled: false
  discord_enabled: false
  alert_score_threshold: 85
llm:
  provider: deepseek
  model: deepseek-chat
  temperature: 0.3
  max_tokens: 4096
  request_timeout_seconds: 60
  max_tokens_per_cycle: 15000
  cache_responses: true
  cache_ttl_seconds: 3600
  deepseek_api_key: REDACTED_COMPROMISED_KEY
post_mortem:
  enabled: true
  delay_hours: 24
  min_history_for_adjustment: 10
  learning_rate: 0.05
  walk_forward_days: 7
  correlation_threshold: 0.75
monitor:
  interval_seconds: 60
  breaking_news_threshold: 0.8
  sl_tp_check_enabled: true
admin:
  password_hash: ''
  session_timeout_minutes: 60
