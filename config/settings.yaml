  - symbol: BNB/USDT
    exchange: binance
    timeframe: 5m
    theme_mapping: [BNB, Binance, BSC]
  - symbol: XRP/USDT
    exchange: binance
    timeframe: 5m
    theme_mapping: [XRP, Ripple, payment]
  - symbol: ADA/USDT
    exchange: binance
    timeframe: 5m
    theme_mapping: [Cardano, smart contract]
  - symbol: DOGE/USDT
    exchange: binance
    timeframe: 5m
