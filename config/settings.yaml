      BTC/USDT: BTC
      ETH/USDT: ETH
      SOL/USDT: SOL
mirofish:
  n_agents: 5000
  n_steps: 100
  seed_news_weight: 0.6
  air_du_temps_weight: 0.4
  inject_custom_vars: {}
  async_mode: false
  timeout_seconds: 120
agents:
  market_data:
    enabled: true
    weight_in_scoring: 1.0
  fundamental:
    enabled: true
    weight_in_scoring: 0.0   # Brier 0.303, WR 40.4%, avg_score 62 (perma-optimiste) → neutralisé
  x_sentiment:
    enabled: true
    weight_in_scoring: 0.0   # Brier 0.413, WR 36.2%, avg_score 77 (perma-haussier) → neutralisé
  contrarian:
    enabled: true
    weight_in_scoring: 0.9
  fear_greed:
    enabled: true
    weight_in_scoring: 0.0   # Brier 0.476, WR 29.8%, avg_score 73 (perma-haussier) → neutralisé
  polymarket:
    enabled: true
    weight_in_scoring: 0.55  # Brier 0.244 — bon calibrage mais dominait trop → réduit
  timesfm:
    enabled: false           # Brier 0.243, WR 48.9% (~aléatoire) → remplacé par Kronos
    weight_in_scoring: 0.0
  kronos:
    enabled: true
    weight_in_scoring: 0.00  # Brier 0.306, WR 30.8%, avg P&L -$0.33/BUY — pire agent → neutralisé
  market_regime:
    enabled: true
    weight_in_scoring: 0.70  # Brier 0.225, WR 66% — meilleur agent → poids maximal
  bull_bear_debate:
    enabled: false
    weight_in_scoring: 0.0
  alpha_combination:
    enabled: false           # true = poids dynamiques IC-based (Fundamental Law)
    min_history: 20          # min trades évalués (result_24h non NULL) pour activer
    lookback_days: 90        # fenêtre glissante d'analyse
    correlation_threshold: 0.70  # seuil corrélation inter-agents (info)
    ic_floor: 0.0            # IC minimal pour recevoir un poids > 0
timesfm:
  forecast_horizon: 24
  backend: cpu
kronos:
  enabled: true
  model_name: "NeoQuasar/Kronos-mini"   # mini (4.1M) | small (24.7M) | base (102.3M)
  forecast_horizon: 96                  # candles à prédire (96 × 15min = 24h)
  lookback: 400                         # candles de contexte (max 2048 pour mini)
  temperature: 1.0                      # sampling temperature (0.1 = déterministe, 2.0 = créatif)
  top_p: 0.9                            # nucleus sampling (0.0 = greedy, 1.0 = full)
  sample_count: 1                       # trajectoires probabilistes (1 = rapide, ≥3 = distribution)
  timeout_seconds: 120                  # timeout worker subprocess
  backend: cpu                          # cpu | cuda (GX10 = CPU uniquement)
market_regime:
  n_hmm_states: 2
  vol_window: 30
  trend_window: 50
  adx_period: 18
scoring:
  weights:
    mirofish: 0.12
    market: 0.50   # technique plus fiable que les agents IA → augmenté
    agents: 0.20   # agents IA sous-performent → réduit
    contrarian: 0.18
  min_weight: 0.05
  max_weight: 0.6
  normalization_window: 30
risk:
  mode: balanced
  kelly_max_fraction: 0.25
  max_drawdown_pct: 15.0
  position_size_pct: 5.0
  min_position_size_pct: 2.0      # plancher absolu même en Kelly négatif (2% = $200)
  atr_multiplier_sl: 2.5
  atr_multiplier_tp: 4.0
  atr_period: 14
  # buy_threshold / exit_threshold : reliques V1 (scoring-based) — non utilisés par V2 (P(up) + HMM)
  # buy_threshold: 65
  # exit_threshold: 40
  human_in_the_loop: false
  ma50_filter_mode: gradual
  ma50_strong_signal_threshold: 72
  ma50_gradual_size_factor: 0.5
  max_open_positions: 5
  sell_threshold: 30
  buy_cooldown_minutes: 20    # min entre deux BUY consécutifs pour le même actif (anti-duplicate)
  sell_cooldown_minutes: 60   # min d'attente après un SELL avant de re-rentrer (anti-churning)
circuit_breaker:
  funding_warning: 0.00018
  funding_block: 0.00045
  sustain_period_cycles: 3
  max_reduction: 0.75
assets:
  universe:
  - symbol: BTC/USDT
    exchange: binance
    timeframe: 5m
    theme_mapping:
    - bitcoin
    - crypto
    - blockchain
  active_asset: BTC/USDT
exchange:
  name: binance
  testnet: true
  websocket: true
  fallback_polling_seconds: 15
  paper_capital_usd: 10000
  limit_order_offset_pct: 0.1
  limit_fill_timeout_s: 120
logging:
  level: INFO
  file_path: logs/zeitgeist.log
  max_bytes: 5242880
  backup_count: 5
  sqlite_db: storage/zeitgeist.db
  format: '[%(asctime)s] [%(levelname)s] [%(name)s] %(message)s'
  telegram_enabled: false
  discord_enabled: false
  alert_score_threshold: 85
llm:
  provider: deepseek
  model: deepseek-chat
  temperature: 0.3
  max_tokens: 4096
  request_timeout_seconds: 60
  max_tokens_per_cycle: 15000
  cache_responses: true
  cache_ttl_seconds: 3600
  deepseek_api_key: REDACTED_COMPROMISED_KEY
post_mortem:
  enabled: true
  delay_hours: 24
  min_history_for_adjustment: 10
  learning_rate: 0.05
  walk_forward_days: 7

# ══════════════════════════════════════════════════════════════════════════════
# QUANT V2 — Tous les paramètres configurables depuis l'Admin UI
# Aucune valeur numérique ne doit être hardcodée dans le code quant/
# ══════════════════════════════════════════════════════════════════════════════
quant:
  # ── Données ────────────────────────────────────────────────────────────────
  symbol: BTC/USDT
  timeframe: 5m                   # 1m | 3m | 5m | 15m | 1h | 4h | 1d
  history_days: 90                # jours d'historique à charger pour le refit

  # ── Pipeline ───────────────────────────────────────────────────────────────
  horizon_bars: 4                 # horizon de prédiction (en barres)
  norm_window_days: 30            # fenêtre de normalisation quantile (en jours, converti auto)
  p_up_threshold: 0.55            # seuil LONG (was 0.58 — trop restrictif BTC/ETH)
  p_dn_threshold: 0.42            # seuil SHORT : P(up) < p_dn_threshold
  train_fraction: 0.70            # fraction train/test pour le live runner
  refit_interval_days: 7          # intervalle de re-fit du modèle

  # ── Signal model ───────────────────────────────────────────────────────────
  use_hmm: true                   # true = HMM, false = fallback ADX+vol_of_vol
  use_lgb: false                  # true = LightGBM (expérimental), false = LogReg
  signal_C: 1.0                   # régularisation LogReg (plus bas = plus régularisé)

  # ── Régime HMM ─────────────────────────────────────────────────────────────
  hmm_n_states: 3                 # nombre d'états HMM (2 ou 3)
  hmm_adx_threshold: 25.0         # seuil ADX mode fallback

  # ── Risk management ────────────────────────────────────────────────────────
  fraction_per_trade: 0.0075      # fraction du capital risqué par trade (0.75%)
  stop_loss_atr_mult: 2.0         # multiplicateur ATR pour le stop-loss (was 2.5)
  take_profit_atr_mult: 4.0       # multiplicateur ATR pour le take-profit (R:R 2.0, was 3.5/1.4)
  trailing_activation_atr: 2.0    # activation trailing à 2×ATR (was 1.5 — coupait winners avant TP)
  trailing_distance_atr: 2.0      # trail distance 2×ATR (was 1.5 — trop serré sur 1d crypto)
  weekly_dd_kill_switch: 0.08     # DD hebdo déclenchant le kill-switch (8%)
  kill_switch_pause_days: 7       # durée de pause après kill-switch

  # ── Backtest ───────────────────────────────────────────────────────────────
  initial_capital: 10000.0        # capital de départ (USD)
  fee_rate: 0.0005                # frais taker par côté (0.05%)
  slippage_rate: 0.0002           # slippage par côté (0.02%)
  # ── Seuils par actif (override p_up / p_dn pour certains actifs) ──────────
  # Format: symbol: {p_up_threshold: X, p_dn_threshold: Y}
  # Les actifs non listés utilisent les seuils globaux ci-dessus.
  asset_thresholds:
    EUR/USD:
      p_up_threshold: 0.58        # EUR/USD : 88 faux LONGs à 0.55 (41.7% WR) → filtrer vers 0.58
      p_dn_threshold: 0.40        # SHORT plus accessible pour EUR trending baissier
    ETH/USDT:
      p_dn_threshold: 0.45        # ETH : min P_up=0.437, débloque shorts potentiels
  # ── Walk-forward ───────────────────────────────────────────────────────────
  wf_train_days: 90               # durée de la fenêtre train (jours)
  wf_test_days: 30                # durée de la fenêtre test OOS (jours)
  wf_step_days: 30                # pas de glissement entre folds (jours)
  wf_min_folds: 12                # nombre minimum de folds
  wf_max_folds: 24                # nombre maximum de folds
  wf_perm_iter: 500               # itérations pour le test de permutation

  # ── Critères go-live durcis (consensus Grok + GPT + DeepSeek) ───────────────
  go_live_sharpe_min: 0.80        # was 0.5 — trop permissif sur intraday bruité
  go_live_pf_min: 1.30            # was 1.2
  go_live_trades_min: 250         # nombre total de trades minimum
  go_live_pvalue_max: 0.05        # was 0.10 — consensus 3 IA
  go_live_positive_folds_pct: 0.65  # was 0.60
  correlation_threshold: 0.75
  meta_analysis_interval_days: 14  # LLM failure-pattern analysis, every N days
  meta_analysis_days: 30            # lookback window for the analysis

  # ── Sources de données (Q11/Q12) ─────────────────────────────────────────
  data_provider: "auto"            # "auto" | "twelve_data" | "yahoo"

  # ── Features avancées (Q13/Q14) ──────────────────────────────────────────
  use_dxy_feature: true            # Q14 : DXY comme feature inter-marché

  # ── Horizon sweep (Q3) ───────────────────────────────────────────────────
  horizon_sweep_values: [2, 4, 8, 12]   # horizons à tester en sweep

  # ── Refit adaptatif KS-test (Q17) ────────────────────────────────────────
  refit_trigger: "schedule"        # "schedule" | "ks_test" | "both"
  refit_ks_pvalue_threshold: 0.05  # seuil KS-test pour déclencher le refit
  refit_ks_window_days: 14         # fenêtre récente pour le KS-test (jours)
monitor:
  interval_seconds: 60
  breaking_news_threshold: 0.8
  sl_tp_check_enabled: true
admin:
  password_hash: ''
  session_timeout_minutes: 60

# ── Sources de données (clé API dans config/secrets.yaml — gitignored) ──────
data:
  provider: "auto"           # "auto" | "twelve_data" | "yahoo"
  twelve_data_key: ""        # override local ; préférer config/secrets.yaml
