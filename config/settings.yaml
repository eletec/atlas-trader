mirofish:
  n_agents: 5000
  n_steps: 100
  seed_news_weight: 0.6
  air_du_temps_weight: 0.4
  inject_custom_vars: {}
  async_mode: false
  timeout_seconds: 120
agents:
  market_data:
    enabled: true
    weight_in_scoring: 1.0
  fundamental:
    enabled: true
    weight_in_scoring: 0.0   # Brier 0.303, WR 40.4%, avg_score 62 (perma-optimiste) → neutralisé
  x_sentiment:
    enabled: true
    weight_in_scoring: 0.0   # Brier 0.413, WR 36.2%, avg_score 77 (perma-haussier) → neutralisé
  contrarian:
    enabled: true
    weight_in_scoring: 0.9
  fear_greed:
    enabled: true
    weight_in_scoring: 0.0   # Brier 0.476, WR 29.8%, avg_score 73 (perma-haussier) → neutralisé
  polymarket:
    enabled: true
    weight_in_scoring: 0.55  # Brier 0.244 — bon calibrage mais dominait trop → réduit
  timesfm:
    enabled: false           # Brier 0.243, WR 48.9% (~aléatoire) → remplacé par Kronos
    weight_in_scoring: 0.0
  kronos:
    enabled: true
    weight_in_scoring: 0.00  # Brier 0.306, WR 30.8%, avg P&L -$0.33/BUY — pire agent → neutralisé
  market_regime:
    enabled: true
    weight_in_scoring: 0.70  # Brier 0.225, WR 66% — meilleur agent → poids maximal
  bull_bear_debate:
    enabled: false
    weight_in_scoring: 0.0
  alpha_combination:
    enabled: false           # true = poids dynamiques IC-based (Fundamental Law)
    min_history: 20          # min trades évalués (result_24h non NULL) pour activer
    lookback_days: 90        # fenêtre glissante d'analyse
    correlation_threshold: 0.70  # seuil corrélation inter-agents (info)
    ic_floor: 0.0            # IC minimal pour recevoir un poids > 0
timesfm:
  forecast_horizon: 24
  backend: cpu
kronos:
  enabled: true
  model_name: "NeoQuasar/Kronos-mini"   # mini (4.1M) | small (24.7M) | base (102.3M)
  forecast_horizon: 96                  # candles à prédire (96 × 15min = 24h)
  lookback: 400                         # candles de contexte (max 2048 pour mini)
  temperature: 1.0                      # sampling temperature (0.1 = déterministe, 2.0 = créatif)
  top_p: 0.9                            # nucleus sampling (0.0 = greedy, 1.0 = full)
  sample_count: 1                       # trajectoires probabilistes (1 = rapide, ≥3 = distribution)
  timeout_seconds: 120                  # timeout worker subprocess
  backend: cpu                          # cpu | cuda (GX10 = CPU uniquement)
market_regime:
  n_hmm_states: 2
  vol_window: 30
  trend_window: 50
  adx_period: 18
scoring:
  weights:
    mirofish: 0.12
    market: 0.50   # technique plus fiable que les agents IA → augmenté
    agents: 0.20   # agents IA sous-performent → réduit
    contrarian: 0.18
  min_weight: 0.05
  max_weight: 0.6
  normalization_window: 30
risk:
  mode: balanced
  kelly_max_fraction: 0.25
  max_drawdown_pct: 15.0
  position_size_pct: 5.0
  min_position_size_pct: 2.0      # plancher absolu même en Kelly négatif (2% = $200)
  atr_multiplier_sl: 2.5
  atr_multiplier_tp: 4.0
  atr_period: 14
  # buy_threshold / exit_threshold : reliques V1 (scoring-based) — non utilisés par V2 (P(up) + HMM)
  # buy_threshold: 65
  # exit_threshold: 40
  human_in_the_loop: false
  ma50_filter_mode: gradual
  ma50_strong_signal_threshold: 72
  ma50_gradual_size_factor: 0.5
  max_open_positions: 5
  sell_threshold: 30
  buy_cooldown_minutes: 20    # min between two consecutive BUYs for the same asset (anti-duplicate)
  sell_cooldown_minutes: 60   # min to wait after a SELL before re-entering (anti-churning)
circuit_breaker:
  funding_warning: 0.00018
  funding_block: 0.00045
  sustain_period_cycles: 3
  max_reduction: 0.75
assets:
  universe:
  - symbol: BTC/USDT
    exchange: binance
    timeframe: 5m
    theme_mapping: [bitcoin, crypto, blockchain]
  - symbol: ETH/USDT
    exchange: binance
    timeframe: 5m
