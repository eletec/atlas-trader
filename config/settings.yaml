    theme_mapping: [Polkadot, parachain, Web3]
  active_asset: BTC/USDT
exchange:
  name: binance
  testnet: true
  websocket: true
  fallback_polling_seconds: 15
  paper_capital_usd: 10000
  limit_order_offset_pct: 0.1
  limit_fill_timeout_s: 120
logging:
  level: INFO
  file_path: logs/zeitgeist.log
  max_bytes: 5242880
  backup_count: 5
  sqlite_db: storage/zeitgeist.db
  format: '[%(asctime)s] [%(levelname)s] [%(name)s] %(message)s'
  telegram_enabled: false
  discord_enabled: false
  alert_score_threshold: 85
llm:
  provider: deepseek
  model: deepseek-v4-pro
  temperature: 0.3
  max_tokens: 4096
  request_timeout_seconds: 60
  max_tokens_per_cycle: 15000
  cache_responses: true
  cache_ttl_seconds: 3600
  deepseek_api_key: ""  # key stored in config/secrets.yaml — DO NOT COMMIT
post_mortem:
  enabled: true
  delay_hours: 24
  min_history_for_adjustment: 10
  learning_rate: 0.05
  walk_forward_days: 7

# ==============================================================================
# QUANT V2 — All parameters configurable from the Admin UI
# No numeric value should be hardcoded in quant/ code
# ==============================================================================
quant:
  # ── Data ───────────────────────────────────────────────────────────────────
  symbol: BTC/USDT
  timeframe: 5m                   # 1m | 3m | 5m | 15m | 1h | 4h | 1d
  history_days: 90                # days of history to load for model refit

  # ── Pipeline ───────────────────────────────────────────────────────────────
  horizon_bars: 4                 # prediction horizon (in bars)
  norm_window_days: 30            # quantile normalisation window (days, auto-converted)
  p_up_threshold: 0.55            # LONG signal threshold
  p_dn_threshold: 0.42            # SHORT threshold: trigger when P(up) < p_dn_threshold
  train_fraction: 0.70            # train/test split fraction for live runner
  refit_interval_days: 7          # model refit interval

  # ── Signal model ───────────────────────────────────────────────────────────
  use_hmm: true                   # true = HMM regime filter, false = fallback ADX+vol_of_vol
  use_lgb: false                  # true = LightGBM (experimental), false = LogisticRegression
  signal_C: 1.0                   # LogReg regularisation strength (lower = more regularised)

  # ── HMM Regime ─────────────────────────────────────────────────────────────
  hmm_n_states: 3                 # number of HMM states (2 or 3)
  hmm_adx_threshold: 25.0         # ADX threshold for fallback regime detection

  # ── Risk management ────────────────────────────────────────────────────────
  fraction_per_trade: 0.0075      # capital fraction risked per trade (0.75%)
  stop_loss_atr_mult: 2.0         # ATR multiplier for stop-loss
  take_profit_atr_mult: 4.0       # ATR multiplier for take-profit (R:R 2.0)
  trailing_activation_atr: 2.0    # trailing stop activation at 2×ATR
  trailing_distance_atr: 2.0      # trailing stop distance 2×ATR
  weekly_dd_kill_switch: 0.08     # weekly drawdown triggering kill-switch (8%)
  kill_switch_pause_days: 7       # pause duration after kill-switch

  # ── Backtest ───────────────────────────────────────────────────────────────
  initial_capital: 10000.0        # starting capital (USD)
  fee_rate: 0.0005                # taker fee per side (0.05%)
  slippage_rate: 0.0002           # slippage per side (0.02%)

  # ── Per-asset thresholds (override global p_up / p_dn) ────────────────────
  # Format: symbol: {p_up_threshold: X, p_dn_threshold: Y}
  # Assets not listed use the global thresholds above.
  asset_thresholds:
    ETH/USDT:
      p_up_threshold: 0.60        # ETH: P_up rarely exceeds 0.60 in non-PANIC regimes
    SOL/USDT:
      p_up_threshold: 0.58        # SOL: max P_up ~0.573 observed on 5y data

  # ── Per-asset config (timeframe and live history override) ─────────────────
  # All Binance perp assets run on 5m real-time loop by default.
  # Override here only if a specific asset requires different settings.
  asset_config: {}

  # ── Walk-forward ───────────────────────────────────────────────────────────
  wf_train_days: 90               # training window duration (days)
  wf_test_days: 30                # OOS test window duration (days)
  wf_step_days: 30                # slide step between folds (days)
  wf_min_folds: 12                # minimum number of folds
  wf_max_folds: 24                # maximum number of folds
  wf_perm_iter: 500               # permutation test iterations

  # ── Go-live criteria (tightened — consensus GPT + Grok + DeepSeek) ─────────
  go_live_sharpe_min: 0.80
  go_live_pf_min: 1.30
  go_live_trades_min: 250         # minimum total trades
  go_live_pvalue_max: 0.05
  go_live_positive_folds_pct: 0.65
  correlation_threshold: 0.75
  meta_analysis_interval_days: 14  # LLM failure-pattern analysis interval (days)
  meta_analysis_days: 30            # lookback window for meta-analysis

  # ── Data sources ───────────────────────────────────────────────────────────
  data_provider: "auto"            # "auto" | "twelve_data" | "yahoo"

  # ── Advanced features ──────────────────────────────────────────────────────
  use_dxy_feature: true            # DXY as cross-market feature

  # ── Horizon sweep ──────────────────────────────────────────────────────────
  horizon_sweep_values: [2, 4, 8, 12]   # horizons to test in sweep

  # ── Adaptive refit KS-test ─────────────────────────────────────────────────
  refit_trigger: "schedule"        # "schedule" | "ks_test" | "both"
  refit_ks_pvalue_threshold: 0.05  # KS-test p-value threshold to trigger refit
  refit_ks_window_days: 14         # recent window for KS-test (days)
monitor:
  interval_seconds: 60
  breaking_news_threshold: 0.8
  sl_tp_check_enabled: true
admin:
  password_hash: ''
  session_timeout_minutes: 60

# ── Sources de données (clé API dans config/secrets.yaml — gitignored) ──────
data:
  provider: "auto"           # "auto" | "twelve_data" | "yahoo"
  twelve_data_key: ""        # override local ; préférer config/secrets.yaml
