# ============================================================
# Atlas Trader — Docker Compose GX10 (ASUS Accent GX10)
# ============================================================
# Différences vs docker-compose.yml (serveur prod) :
#   - TimesFM ACTIVÉ (backend: cpu) — modèle ~2GB préchargé dans l'image
#   - mem_limit 12g (GX10 dispose de plus de RAM)
#   - settings.yaml GX10 monté (timesfm.enabled: true)
#   - Port local uniquement (127.0.0.1 — machine non-partagée)
#
# Usage :
#   cp .env.example .env
#   docker compose -f docker-compose.gx10.yml build
#   docker compose -f docker-compose.gx10.yml up -d
#   docker compose -f docker-compose.gx10.yml logs -f
#   docker compose -f docker-compose.gx10.yml down
# ============================================================

name: atlas-trader-gx10

volumes:
  atlas_storage_gx10:
    driver: local
  atlas_logs_gx10:
    driver: local
  atlas_letsencrypt:
    driver: local
  atlas_certbot_www:
    driver: local

networks:
  atlas_net:
    driver: bridge

services:

  atlas:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: atlas-trader:gx10
    container_name: atlas-trader-gx10
    command: all
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=production
      - DAEMON_INTERVAL=${DAEMON_INTERVAL:-900}
      - TZ=Europe/Paris
    ports:
      # LAN uniquement — nginx gère l'accès externe en HTTPS
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    volumes:
      # Persistance des données
      - atlas_storage_gx10:/app/storage
      - atlas_logs_gx10:/app/logs
      # Config GX10 — timesfm activé (override du settings.yaml de prod)
      - ./config/settings.gx10.yaml:/app/config/settings.yaml:rw
      - ./config/prompts.yaml:/app/config/prompts.yaml:ro
      - ./config/assets:/app/config/assets:rw
      - ./.streamlit/config.toml:/app/.streamlit/config.toml:ro
      # Code source monté pour faciliter les tests
      - ./dashboard:/app/dashboard:ro
      - ./agents:/app/agents:ro
      - ./graph:/app/graph:ro
      - ./quant:/app/quant:ro
      - ./execution:/app/execution:ro
      - ./utils:/app/utils:ro
      - ./main.py:/app/main.py:ro
      - ./decision_engine.py:/app/decision_engine.py:ro
    networks:
      - atlas_net
    healthcheck:
      test: ["CMD", "/app/docker/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s    # Plus long — TimesFM charge ~60s au premier démarrage
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── Nginx HTTPS reverse proxy ──────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: atlas-nginx-gx10
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/entrypoint.sh:/entrypoint.sh:ro
      - atlas_letsencrypt:/etc/letsencrypt
      - atlas_certbot_www:/var/www/certbot
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - atlas
    networks:
      - atlas_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ── Certbot Let's Encrypt (renouvellement automatique) ──────
  certbot:
    image: certbot/certbot
    container_name: atlas-certbot-gx10
    restart: unless-stopped
    volumes:
      - atlas_letsencrypt:/etc/letsencrypt
      - atlas_certbot_www:/var/www/certbot
    # Vérifie le renouvellement toutes les 12h (LE expire à 90 jours)
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
