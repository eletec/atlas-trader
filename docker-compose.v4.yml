# ============================================================
# Atlas Trader V4 — Docker Compose (développement local)
# ============================================================
# Usage :
#   docker compose -f docker-compose.v4.yml up -d
#   docker compose -f docker-compose.v4.yml logs -f
#   docker compose -f docker-compose.v4.yml down
#
# Services :
#   atlas-v4-api       : FastAPI — DAG executor + API REST + SSE prix
#   atlas-v4-frontend  : Next.js — éditeur visuel React Flow
#   atlas-v4-ollama    : Ollama — modèles IA locaux (phi4, llama3, mistral)
#
# Volumes ISOLÉS de V3/GX10 — aucun partage avec docker-compose.yml
# V3 continue de tourner sur GX10, indépendamment.
# ============================================================

name: atlas-trader-v4

volumes:
  v4_storage:          # SQLite, DAG JSON, logs
  v4_models:           # modèles Ollama téléchargés

networks:
  v4_net:
    driver: bridge

services:

  # ----------------------------------------------------------
  # API — FastAPI + DAG Executor
  # ----------------------------------------------------------
  atlas-v4-api:
    build:
      context: .
      dockerfile: v4/Dockerfile.backend
    container_name: atlas-v4-api
    restart: unless-stopped
    networks: [v4_net]
    ports:
      - "8000:8000"
    volumes:
      - v4_storage:/app/data
      - ./config:/app/src/config:ro   # config files (carry_assets.yaml, etc.) — bind mount pour hot reload
      - .:/app/src:ro                 # code source monté en lecture seule (hot reload)
    environment:
      - V4_ENV=development
      - V4_TESTNET=true
      - OLLAMA_URL=http://atlas-v4-ollama:11434
      - TZ=Europe/Paris
      - DATABASE_URL=sqlite:////app/data/v4.db
      - V4_INTENSITY=balanced     # conservative | balanced | aggressive
      # Clé API DeepSeek (optionnelle — fallback Ollama local si absente)
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    depends_on:
      - atlas-v4-ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------
  # Frontend — Next.js + React Flow (DAG Canvas)
  # DÉSACTIVÉ (25/07/2026) — DeepSeek/GPT audit: infrastructure DAG surdimensionnée.
  # Remplacé par run_carry_cycle.py + dashboard Streamlit.
  # ----------------------------------------------------------
  # atlas-v4-frontend:
  #   build:
  #     context: v4/frontend
  #     dockerfile: Dockerfile
  #   container_name: atlas-v4-frontend
  #   restart: unless-stopped
  #   networks: [v4_net]
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - NEXT_PUBLIC_API_URL=http://localhost:8000
  #     - NEXT_PUBLIC_SSE_URL=http://localhost:8000/prices/stream
  #   depends_on:
  #     - atlas-v4-api

  # ----------------------------------------------------------
  # Dashboard — Streamlit (interface unifiée trades/logs/PNL)
  # ----------------------------------------------------------
  atlas-v4-dashboard:
    build:
      context: .
      dockerfile: v4/Dockerfile.backend
    container_name: atlas-v4-dashboard
    command: streamlit run /app/src/dashboard/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    restart: unless-stopped
    networks: [v4_net]
    ports:
      - "8502:8501"
    environment:
      - PYTHONPATH=/app/src
      - V4_ENV=development
      - V4_TESTNET=true
      - OLLAMA_URL=http://atlas-v4-ollama:11434
      - TZ=Europe/Paris
      - DATABASE_URL=sqlite:////app/data/v4.db
      - STREAMLIT_SERVER_PORT=8501
      - V4_API_URL=http://atlas-v4-api:8000
      - V4_FRONTEND_URL=http://192.168.1.80:3000
    volumes:
      - v4_storage:/app/data
      - ./config:/app/src/config:ro
      - .:/app/src:ro
    depends_on:
      - atlas-v4-api
      - atlas-v4-ollama

  # ----------------------------------------------------------
  # Ollama — modèles IA locaux
  # ----------------------------------------------------------
  atlas-v4-ollama:
    image: ollama/ollama:latest
    container_name: atlas-v4-ollama
    restart: unless-stopped
    networks: [v4_net]
    ports:
      - "11434:11434"
    volumes:
      - v4_models:/root/.ollama
    # Pour activer le GPU (optionnel) :
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
