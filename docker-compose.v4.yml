# ============================================================
# Atlas Trader V7 — Docker Compose
# ============================================================
# Usage:
#   docker compose -f docker-compose.v4.yml up -d
#   docker compose -f docker-compose.v4.yml logs -f
#
# Services:
#   atlas-v4-api       : FastAPI :8000 — carry cycle + PositionMonitor + price
#   atlas-v4-dashboard : Streamlit :8502 — BO + FO unified
# ============================================================

name: atlas-trader-v4

volumes:
  v4_storage:          # SQLite, carry_assets.yaml, logs

networks:
  v4_net:
    driver: bridge

services:

  # ----------------------------------------------------------
  # API — FastAPI + Carry Cycle
  # ----------------------------------------------------------
  atlas-v4-api:
    build:
      context: .
      dockerfile: v4/Dockerfile.backend
    container_name: atlas-v4-api
    restart: unless-stopped
    networks: [v4_net]
    ports:
      # Loopback only. nginx on the host proxies /api/ to 127.0.0.1:8000, so the
      # UI is unaffected. Published as 0.0.0.0:8000 the API had no authentication
      # and was reachable from the internet: scanners were already posting to
      # /dag/reset-kill-switch.
      - "127.0.0.1:8000:8000"
    volumes:
      - v4_storage:/app/data
      - ./config:/app/src/config:ro
      - .:/app/src:ro
    environment:
      - V4_ENV=development
      - V4_TESTNET=true
      - TZ=Europe/Paris
      - DATABASE_URL=sqlite:////app/data/v4.db
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    depends_on: []
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------
  # Dashboard — Streamlit
  # ----------------------------------------------------------
  atlas-v4-dashboard:
    build:
      context: .
      dockerfile: v4/Dockerfile.backend
    container_name: atlas-v4-dashboard
    command: streamlit run /app/src/dashboard/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    restart: unless-stopped
    networks: [v4_net]
    ports:
      # Loopback only: nginx (or a tunnel) is the only way in.
      - "127.0.0.1:8502:8501"
    environment:
      - PYTHONPATH=/app/src
      - V4_ENV=development
      - V4_TESTNET=true
      - TZ=Europe/Paris
      - DATABASE_URL=sqlite:////app/data/v4.db
      - STREAMLIT_SERVER_PORT=8501
      - V4_API_URL=http://atlas-v4-api:8000
    volumes:
      - v4_storage:/app/data
      - ./config:/app/src/config:ro
      - .:/app/src:ro
    depends_on:
      - atlas-v4-api
