# ============================================================
# Atlas Trader — Docker Compose
# ============================================================
# Usage :
#   cp .env.example .env         # Remplir les clés API
#   docker compose up -d         # Démarrer tous les services
#   docker compose logs -f       # Voir les logs
#   docker compose down          # Arrêter
#
# Services :
#   atlas-all        : Container tout-en-un (trader + dashboard)
#   OR séparément :
#   atlas-trader     : Boucle de trading daemon
#   atlas-dashboard  : Interface Streamlit (port 8501)
# ============================================================

name: atlas-trader

# ---- Volumes partagés ----
# External = épinglés aux volumes historiques GX10 — survivent aux rebuilds/renommages
volumes:
  atlas_storage:
    external: true
    name: atlas-trader-gx10_atlas_storage_gx10
  atlas_logs:
    external: true
    name: atlas-trader-gx10_atlas_logs_gx10
  atlas_config:
    driver: local

# ---- Networks ----
networks:
  atlas_net:
    driver: bridge
  # Réseau nginx GX10 — external pour survivre aux rebuilds
  nginx_net:
    external: true
    name: atlas-trader-gx10_atlas_net

# ============================================================
# PROFIL "all-in-one" (défaut) : un seul container
# ============================================================
services:

  # ---- Container unique tout-en-un (supervisord) ----
  atlas:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: atlas-trader:latest
    container_name: atlas-trader-gx10
    command: all
    restart: unless-stopped
    # Forcer root pour que entrypoint.sh puisse chmod les bind-mounts host
    # (évite [Errno 13] Permission denied sur settings.gx10.yaml)
    user: root
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=production
      - DAEMON_INTERVAL=${DAEMON_INTERVAL:-900}   # 15 minutes
      - TZ=Europe/Paris
      - SETTINGS_FILE=/app/config/settings.gx10.yaml
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    volumes:
      # Persistance des données (DB SQLite, logs, config éditable)
      - atlas_storage:/app/storage
      - atlas_logs:/app/logs
      - atlas_config:/app/config
      # Code storage (override le volume pour database.py)
      - ./storage/database.py:/app/storage/database.py:ro
      - ./storage/__init__.py:/app/storage/__init__.py:ro
      # Montage optionnel des fichiers de config locaux (override)
      - ./config/settings.yaml:/app/config/settings.yaml:rw
      - ./config/settings.gx10.yaml:/app/config/settings.gx10.yaml:rw
      - ./config/prompts.yaml:/app/config/prompts.yaml:ro
      - ./config/profiles.yaml:/app/config/profiles.yaml:ro
      - ./config/users.yaml:/app/config/users.yaml:rw
      - ./config/assets:/app/config/assets:rw
      # Config Streamlit (thème, toolbar…)
      - ./.streamlit/config.toml:/app/.streamlit/config.toml:ro
      # Montage du code source — permet les mises a jour sans rebuild
      - ./dashboard:/app/dashboard:ro
      - ./agents:/app/agents:ro
      - ./comparison:/app/comparison:ro
      - ./graph:/app/graph:ro
      - ./quant:/app/quant:ro
      - ./execution:/app/execution:ro
      - ./utils:/app/utils:ro
      - ./main.py:/app/main.py:ro
      - ./run_v2.py:/app/run_v2.py:ro
      - ./docker/supervisord.conf:/app/docker/supervisord.conf:ro
      - ./docker/watchdog.sh:/app/docker/watchdog.sh:ro
    networks:
      - atlas_net
      - nginx_net
    healthcheck:
      test: ["CMD", "/app/docker/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    # Limites mémoire — évite OOM kill / Docker hang sur NAS (15GB RAM total)
    mem_limit: 8g
    memswap_limit: 8g
    # Pas de profil = service actif par défaut (docker compose up)

  # ============================================================
  # PROFIL "split" : services séparés (pour le scaling)
  # docker compose --profile split up -d
  # ============================================================

  # ---- Service Trader (daemon) ----
  atlas-trader:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: atlas-trader:latest
    container_name: atlas-trader-daemon
    command: trader
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DAEMON_INTERVAL=${DAEMON_INTERVAL:-900}
    volumes:
      - atlas_storage:/app/storage
      - ./storage/database.py:/app/storage/database.py:ro
      - ./storage/__init__.py:/app/storage/__init__.py:ro
      - atlas_logs:/app/logs
      - atlas_config:/app/config
      - ./config/settings.yaml:/app/config/settings.yaml:rw
    networks:
      - atlas_net
    profiles:
      - split

  # ---- Service Dashboard (Streamlit) ----
  atlas-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: atlas-trader:latest
    container_name: atlas-dashboard
    command: dashboard
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    volumes:
      - atlas_storage:/app/storage
      - ./storage/database.py:/app/storage/database.py:ro
      - ./storage/__init__.py:/app/storage/__init__.py:ro
      - atlas_logs:/app/logs
      - atlas_config:/app/config
      - ./config/settings.yaml:/app/config/settings.yaml:rw
    networks:
      - atlas_net
    depends_on:
      - atlas-trader
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    profiles:
      - split

  # ============================================================
  # PROFIL "test" : un seul cycle de test
  # docker compose --profile test run atlas-test
  # ============================================================
  atlas-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: atlas-trader:latest
    container_name: atlas-test
    command: test
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - atlas_storage:/app/storage
      - ./storage/database.py:/app/storage/database.py:ro
      - ./storage/__init__.py:/app/storage/__init__.py:ro
      - atlas_logs:/app/logs
      - ./config/settings.yaml:/app/config/settings.yaml:rw
    networks:
      - atlas_net
    profiles:
      - test
