# ============================================================
# Nginx reverse proxy — Atlas Trader GX10
# HTTPS Let's Encrypt via Certbot (webroot challenge)
# ============================================================

# HTTP : sert le challenge ACME, redirige tout le reste en HTTPS
server {
    listen 80;
    server_name atlastrader.org www.atlastrader.org;

    # Requis pour que Certbot valide le domaine
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://atlastrader.org$request_uri;
    }
}

# HTTPS : certificat Let's Encrypt
server {
    listen 443 ssl;
    server_name atlastrader.org www.atlastrader.org;

    ssl_certificate     /etc/letsencrypt/live/atlastrader.org-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atlastrader.org-0001/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Streamlit nécessite de grands headers (session tokens)
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;

    location / {
        proxy_pass         http://atlas:8501;
        proxy_http_version 1.1;

        # WebSocket — obligatoire pour Streamlit
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # Évite le timeout sur les longues sessions Streamlit
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }
}
