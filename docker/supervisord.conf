; ============================================================
; supervisord.conf â€” Atlas Trader
; GÃ¨re les deux processus principaux dans un seul container
; ============================================================

[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=5
loglevel=info
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ============================================================
; Programme 1 : Daemon trader (boucle principale)
; ============================================================
[program:trader]
command=/usr/local/bin/python /app/main.py --daemon
directory=/app
autostart=true
autorestart=true
startsecs=10
startretries=100
stopwaitsecs=30
stdout_logfile=/app/logs/trader.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/app/logs/trader_err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1"
stopasgroup=true
killasgroup=true
priority=100

; ============================================================
; Watchdog : redémarre le trader si aucun cycle depuis 30min
; ============================================================
[program:watchdog]
command=/app/docker/watchdog.sh
directory=/app
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/app/logs/watchdog.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
stderr_logfile=/dev/null
priority=150

; ============================================================
; Programme 2 : Dashboard Streamlit
; ============================================================
[program:dashboard]
command=/usr/local/bin/streamlit run /app/dashboard/streamlit_app.py
    --server.headless true
    --server.port 8501
    --server.address 0.0.0.0
    --server.enableCORS false
    --server.enableXsrfProtection true
directory=/app
autostart=true
autorestart=true
startsecs=15
startretries=3
stopwaitsecs=15
stdout_logfile=/app/logs/dashboard.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/app/logs/dashboard_err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1"
priority=200
; Le dashboard peut dÃ©marrer mÃªme si le trader Ã©choue
depends_on=
